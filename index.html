<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>추가 후보군 파이프라인</title>
<style>
:root{
  color-scheme:light;
  --surface-1:#fcfcfb; --plane:#f9f9f7; --band:#f2f1ed;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --f7:#0d366b; --f6:#184f95; --f5:#256abf; --f4:#5598e7; --f3:#9ec5f4; --fit-ink:#fff;
}

*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1560px;margin:0 auto;padding:20px 18px 70px}
h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px;margin-top:3px}
.ver{margin-top:4px;font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ver b{font-weight:700;color:var(--ink-2);background:var(--band);border:1px solid var(--grid);border-radius:4px;padding:0 5px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--surface-1);border:1px solid var(--ring);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.kpi .v small{font-size:11px;font-weight:400;color:var(--muted);margin-left:3px}

/* 필터 */
.bar{position:sticky;top:0;z-index:30;background:var(--plane);
  padding:9px 0 9px;margin-bottom:2px;border-bottom:1px solid var(--grid);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--band);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12px;font-weight:600;
  padding:5px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface-1);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--axis);background:var(--surface-1);color:var(--ink-2);font:inherit;font-size:11.5px;
  padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface-1);border-color:var(--ink)}
input[type=search],select.ctl{border:1px solid var(--axis);background:var(--surface-1);color:var(--ink);
  font:inherit;font-size:12px;padding:5px 9px;border-radius:7px;min-width:0}
input[type=search]{width:150px}
label.tg{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.spacer{flex:1}
.btn{border:1px solid var(--axis);background:var(--surface-1);color:var(--ink);font:inherit;font-size:12px;
  font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--band)}
.btn.on{border-color:var(--s1);box-shadow:inset 0 0 0 1px var(--s1)}

/* 리스트 */
.cols{display:grid;gap:16px;margin-top:10px}
.cols.two{grid-template-columns:1fr 1fr}
@media(max-width:1180px){.cols.two{grid-template-columns:1fr}}
.colh{display:flex;align-items:baseline;gap:8px;padding:0 2px 6px;border-bottom:2px solid var(--axis);margin-bottom:2px}
.colh b{font-size:13px}
.colh span{font-size:11.5px;color:var(--muted)}

.row{display:grid;grid-template-columns:30px 86px 1fr 152px 64px 64px 34px 24px;
  gap:9px;align-items:center;padding:5px 6px;border-bottom:1px solid var(--grid);
  background:var(--surface-1);cursor:default}
.row:hover{background:var(--band)}
.rhead{position:sticky;top:47px;z-index:20;background:var(--plane);color:var(--muted);
  font-size:10px;font-weight:600;letter-spacing:.02em;border-bottom:1px solid var(--axis);padding:5px 6px;cursor:default}
.rhead:hover{background:var(--plane)}
.rk{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
/* 선정 컷 강조 */
.row.cut{background:color-mix(in srgb,var(--s1) 5%,var(--surface-1));
  box-shadow:inset 3px 0 0 var(--s1)}
.row.cut:hover{background:color-mix(in srgb,var(--s1) 10%,var(--surface-1))}
.row.cut .nm a{font-weight:700}
.rk .cn{color:var(--s1);font-weight:800;font-size:12px}
.row.out{opacity:.62}
.row.out:hover{opacity:1}
.row.flag.cut{box-shadow:none}
.cutline{display:flex;align-items:center;gap:8px;margin:3px 0 2px;color:var(--s1);
  font-size:10px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.cutline:before,.cutline:after{content:"";flex:1;height:0;border-top:2px dashed color-mix(in srgb,var(--s1) 55%,transparent)}
.cutline span{padding:0 2px}


.nm{min-width:0}
.nm a{color:var(--ink);font-weight:600;font-size:13px;text-decoration:none;
  display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.nm a:hover{text-decoration:underline;text-decoration-color:var(--axis)}
.meta{font-size:10.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gp{display:inline-block;font-size:10px;font-weight:600;color:var(--ink-2);background:var(--band);
  border:1px solid var(--grid);padding:0 6px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.gp.off{border-color:var(--s1);color:var(--s1);background:color-mix(in srgb,var(--s1) 10%,transparent)}
.row.flag .gp{color:var(--muted)!important;border-color:var(--grid)!important;background:var(--band)!important}
.gem{display:inline-block;font-size:9.5px;font-weight:800;color:#fff;background:var(--s3);
  padding:1px 5px;border-radius:999px;margin-left:6px;vertical-align:1px;letter-spacing:-.02em}
.row.flag .gem{background:var(--axis)}
.b19{display:inline-block;background:var(--crit);color:#fff;font-size:9px;font-weight:800;
  padding:1px 4px;border-radius:3px;margin-left:5px;vertical-align:1px;letter-spacing:-.02em}
.bsearch{font-size:9.5px;color:var(--muted);border:1px solid var(--grid);border-radius:3px;padding:0 3px;margin-left:4px}

/* 4축 */
.ax{display:flex;gap:3px}
.ax i{flex:1;height:28px;border-radius:3px;position:relative;background:var(--band);
  display:flex;align-items:flex-end;font-style:normal;overflow:hidden}
.ax i b{display:block;width:100%;font-size:9px;font-weight:700;color:#fff;text-align:center;line-height:1.5}
.ax.na{color:var(--muted);font-size:10px;align-items:center;justify-content:center;height:28px}

.axh{display:flex;gap:3px}
.axh i{flex:1;font-style:normal;text-align:center;font-size:8.5px;line-height:1.25;color:var(--muted);font-weight:600}
.axh i em{display:block;height:3px;border-radius:2px;margin-bottom:2px}
.axh i b{display:block;font-weight:600;font-size:8px;color:var(--muted)}
.num{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.num small{display:block;font-size:9.5px;color:var(--muted)}
.fit{font-size:15px;font-weight:700;text-align:center;border-radius:5px;padding:3px 0;color:var(--fit-ink);
  font-variant-numeric:tabular-nums}
.fit.na{background:var(--band)!important;color:var(--muted);font-size:11px;font-weight:600}
.iss{border:1px solid var(--grid);background:transparent;color:var(--muted);border-radius:5px;
  width:22px;height:22px;font-size:12px;line-height:1;cursor:pointer;padding:0}
.iss:hover{border-color:var(--crit);color:var(--crit)}
.row.flag .iss{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.row.flag{background:var(--band)}
.row.flag .nm a,.row.flag .num,.row.flag .rk,.row.flag .meta{color:var(--muted)!important}
.row.flag .nm a{text-decoration:line-through;text-decoration-color:var(--axis)}
.row.flag .ax,.row.flag .fit{filter:grayscale(1);opacity:.45}
.row.flag .b19{background:var(--axis)}

.cm{grid-column:2/7;font-size:11px;color:var(--ink-2);line-height:1.5;cursor:pointer;padding-bottom:2px}
.cm.clip{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.row{row-gap:1px}
.rsn{border:1px solid var(--crit);background:var(--surface-1);color:var(--crit);font:inherit;font-size:10.5px;
  padding:1px 4px;border-radius:5px;margin-left:6px;font-weight:600;vertical-align:1px}
.fit{cursor:help}
#tip{position:fixed;z-index:100;max-width:420px;background:var(--ink);color:#fff;border-radius:8px;
  padding:10px 12px;font-size:11.5px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.22);
  pointer-events:none;opacity:0;transition:opacity .09s;display:none}
#tip.on{opacity:1;display:block}
#tip .tt{font-size:12.5px;font-weight:700;margin-bottom:5px}
#tip .tx{display:flex;gap:10px;margin-bottom:6px;font-size:10.5px;color:#e8e7e2}
#tip .tx s{text-decoration:none;display:flex;align-items:center;gap:4px}
#tip .tx s i{width:7px;height:7px;border-radius:2px;display:inline-block}
#tip .tc{color:#e8e7e2;border-top:1px solid rgba(255,255,255,.18);padding-top:6px;margin-top:2px}
.ow{min-width:0}
.osel{width:100%;font:inherit;font-size:10.5px;font-weight:600;color:var(--ink-2);
  border:1px solid var(--grid);background:var(--surface-1);border-radius:999px;
  padding:2px 4px;cursor:pointer;appearance:none;text-align:center;text-align-last:center}
.osel:hover{border-color:var(--axis);background:var(--band)}
.osel.set{border-color:var(--s3);color:var(--ink);background:color-mix(in srgb,var(--s3) 10%,transparent)}
.row.flag .osel{color:var(--muted)!important;border-color:var(--grid)!important;background:transparent!important}
.vr{width:1px;height:18px;background:var(--grid)}
.issh{font-size:9.5px;color:var(--muted);text-align:center;font-weight:600}
.btn.prim{background:var(--s1);border-color:var(--s1);color:#fff}
.btn.prim:hover{background:var(--f5)}
.mwrap{position:fixed;inset:0;z-index:200;background:rgba(11,11,11,.36);display:flex;
  align-items:center;justify-content:center;padding:20px}
.mwrap[hidden]{display:none}
.mbox{background:var(--surface-1);border-radius:12px;padding:18px 20px;width:400px;max-width:100%;
  box-shadow:0 18px 50px rgba(0,0,0,.28)}
.mbox .mt{font-size:15px;font-weight:700;margin-bottom:14px}
.mbox .ml{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px}
.mbox .mch{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.mbox input{width:100%;border:1px solid var(--axis);border-radius:7px;padding:7px 10px;
  font:inherit;font-size:12.5px;background:var(--surface-1);color:var(--ink)}
.mbox .mb{display:flex;gap:7px;align-items:center;margin-top:16px}
.chipsync{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chipsync[data-s=off]{background:color-mix(in srgb,var(--warn) 26%,transparent);color:var(--ink)}
.chipsync[data-s=ok]{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--ink)}
.chipsync[data-s=err]{background:color-mix(in srgb,var(--crit) 20%,transparent);color:var(--ink)}
.empty{padding:36px;text-align:center;color:var(--muted);font-size:13px}
.status{font-size:11px;color:var(--muted);white-space:nowrap}
.status.err{color:var(--serious)}
.status.ok{color:var(--good)}
</style></head><body><div class="wrap">
<div class="top">

</div>

</div>

/* 새 publishable 키(sb_publishable_...)는 apikey 헤더로만 보내야 하고,
   구 anon 키(eyJ... JWT)는 Authorization 헤더도 함께 보낸다 */
const SB_NEWKEY = /^sb_publishable_/.test(SUPABASE_ANON_KEY);
const SB={on:!!(SUPABASE_URL&&SUPABASE_ANON_KEY),
  url:`${SUPABASE_URL}/rest/v1/${SB_TABLE}`,

let LASTPUSH=0, PULLING=false;
function chip(state,txt){
  const c=document.getElementById("syncChip"); c.hidden=false; c.dataset.s=state; c.textContent=txt;
  c.style.cursor = LASTERR ? "pointer" : "default";
}
document.addEventListener("click",(e)=>{
  if(!e.target.closest("#syncChip")) return;
  alert(LASTERR ? `공유 저장소 오류\n\n${LASTERR}\n\n주소: ${SB.url}\n보드: ${board}`
                : `공유 저장소 정상\n\n주소: ${SB.url}\n보드: ${board}\n키: ${SUPABASE_ANON_KEY.slice(0,24)}…`);
});
let LASTERR="";
async function sbPull(first){
  if(!SB.on||PULLING) return;
  if(!first && Date.now()-LASTPUSH<6000) return;   // 내가 방금 고친 값은 덮어쓰지 않는다
  PULLING=true;
  try{
    const r=await fetch(`${SB.url}?id=eq.${encodeURIComponent(board)}&select=data`,{headers:SB.hdr});
    const txt=await r.text();
    if(!r.ok) throw new Error(`읽기 ${r.status} — ${txt.slice(0,200)}`);
    const j=JSON.parse(txt);
    if(!Array.isArray(j)) throw new Error(`읽기 응답 형식 오류 — ${txt.slice(0,200)}`);
    if(j[0]&&j[0].data){
      const inc=j[0].data.flag||{}, io2=j[0].data.own||{};
      if(JSON.stringify(inc)!==JSON.stringify(FLAG)||JSON.stringify(io2)!==JSON.stringify(OWN)){
        FLAG=inc; OWN=io2; render(); }
    }
    LASTERR=""; chip("ok","공유 저장소 연결됨");
    READY=true;
  }catch(e){
    LASTERR=String(e.message||e);
    console.error("[공유 저장소] 읽기 실패:",LASTERR);
    chip("err","읽기 실패 — 눌러서 원인 보기");
  }
  PULLING=false;
}
async function sbPush(){
  if(!SB.on) return;
  LASTPUSH=Date.now();
  try{
    const r=await fetch(SB.url,{method:"POST",
      headers:{...SB.hdr,Prefer:"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify({id:board,data:{flag:FLAG,own:OWN},updated_at:new Date().toISOString()})});
    if(!r.ok){ const t=await r.text(); throw new Error(`저장 ${r.status} — ${t.slice(0,200)}`); }
    LASTERR=""; chip("ok","저장됨 — 모두에게 반영");
  }catch(e){
    LASTERR=String(e.message||e);
    console.error("[공유 저장소] 저장 실패:",LASTERR);
    chip("err","저장 실패 — 눌러서 원인 보기");
  }
}

/* ── 선정 컷 — 전체 50 (남성향 30 + 여성향 20) ── */
const CUT={all:50,"남":30,"여":20};
W.forEach((w,i)=>w._i=i);
let RANK={};      // _i -> {all, m, f}
function ranks(){
  RANK={};
  const live=W.filter(w=>w.fit!=null && !FLAG[w.n]);
  [["fit","f"],["s4","s"]].forEach(([key,tag])=>{
    const pool=[...live].sort((a,b)=>(b[key]-a[key])||(b.fit-a.fit)||((a.rk||9e9)-(b.rk||9e9)));
    let i=0,m=0,f=0;
    pool.forEach(w=>{
      const r=RANK[w._i]||(RANK[w._i]={});
      r["all"+tag]=++i;
      if(w.t==="남") r["m"+tag]=++m;
      if(w.t==="여") r["f"+tag]=++f;
    });
  });
}
/* 원석 지수 — 조회수 포함 순위 대비 제작 4축 순위가 얼마나 앞서는가 */
const gem=(w)=>{const r=RANK[w._i]; return r?(r.allf-r.alls):0;};
const tag=()=>BASIS==="s4"?"s":"f";
const cutRank=(w,scope)=>{
  const r=RANK[w._i]; if(!r) return null;
  const k=(scope==="남"?"m":scope==="여"?"f":"all")+tag();
  return r[k]??null;
};
const inCut=(w,scope)=>{
  if(scope==="none") return false;
  const v=cutRank(w,scope); if(v==null) return false;
  return v<=(CUT[scope]||CUT.all);
};

/* ── 필터·정렬 ── */
function view(){
  let a = W.filter(w=>{
    if(G.size && !G.has(w.g||"미정")) return false;
    if(O.size && !O.has(ownerOf(w))) return false;
    if(YEAR && (!w.d || w.d < YEAR)) return false;
    if(ONLYGEM && gem(w) < 15) return false;
    if(Q && !w.n.toLowerCase().includes(Q)) return false;
    if(HIDE && FLAG[w.n]) return false;
    return true;
  });
  const key={basis:w=>w[BASIS], fit:w=>w.fit, s4:w=>w.s4, gw:w=>w.gw, kr:w=>w.kr,
             gem:w=>gem(w), rk:w=>w.rk==null?9e9:-w.rk, d:w=>w.d?w.d.replace(/-/g,""):0}[SORT]||((w)=>w[BASIS]);
  a.sort((x,y)=>{
    const fx=!!FLAG[x.n], fy=!!FLAG[y.n]; if(fx!==fy) return fx?1:-1;   // 이슈 작품은 항상 아래로
    const vx=key(x)??-1, vy=key(y)??-1;
    if(vy!==vx) return (SORT==="rk"||SORT==="d") ? (SORT==="d" ? (vy>vx?1:-1) : (vx>vy?1:-1)) : vy-vx;
    return (x.rk||9e9)-(y.rk||9e9);
  });
  return a;
}

/* ── 행 ── */
function rowHTML(w,i,scope){
  const cut=inCut(w,scope), cr=cutRank(w,scope);
  const flag = FLAG[w.n];
  const genre = w.g||"장르 미정";
  const meta = [w.t?({"남":"남성향","여":"여성향","여/남":"여·남"}[w.t]||w.t):null,
                w.ep?`${w.ep}화`:null, w.d].filter(Boolean).join(" · ");
  const gp = `<span class="gp">${esc(genre)}</span>`;
  const ax = w.a==null ? `<div class="ax na">채점 대기</div>`
    : `<div class="ax">`+[w.a,w.b,w.c,w.e].map((v,j)=>
        `<i title="${AXN[j]} ${v}점"><b style="height:${v*10}%;background:${AXC[j]};display:flex;align-items:center;justify-content:center">${v}</b></i>`).join("")+`</div>`;
  const V = BASIS==="s4" ? w.s4 : w.fit;
  const fit = V==null ? `<div class="fit na">—</div>`
    : `<div class="fit" style="background:${fitVar(BASIS==="s4"?V+8:V)}" data-tip="${esc(w.n)}">${V}</div>`;
  const g = gem(w);
  const gb = (BASIS==="s4" && g>=15) ? `<span class="gem" title="조회수 포함 순위 ${RANK[w._i].allf}위 → 제작 4축 ${RANK[w._i].alls}위 (${g}계단 상승)">▲${g}</span>` : "";
  return `<div class="row${flag?" flag":""}${cut?" cut":(w.fit!=null&&!flag?" out":"")}" data-n="${esc(w.n)}">
    <div class="rk">${cut?`<b class="cn">${cr}</b>`:(cr??"·")}</div>
    <div class="ow"><select class="osel${ownerOf(w)!=="미정"?" set":""}" data-o="${esc(w.n)}">${
      OWNERS.concat(OWNERS.includes(ownerOf(w))?[]:[ownerOf(w)])
        .map(o=>`<option${o===ownerOf(w)?" selected":""}>${esc(o)}</option>`).join("")
    }<option value="__c">＋ 직접 입력…</option></select></div>
    <div class="nm">
      <a href="${link(w)}" target="_blank" rel="noopener">${esc(w.n)}</a>${gp}${gb}${w.id?"":`<span class="bsearch">검색</span>`}${flag?`<span class="rsn">${esc(flag)}</span>`:""}
      <div class="meta">${esc(meta)}</div>
    </div>
    ${ax}
    <div class="num">${fmt(w.gw)}<small>GW</small></div>
    <div class="num">${fmt(w.kr)}<small>한국</small></div>
    ${fit}
    <button class="iss" title="이슈 표시 / 해제">${flag?"⊘":"○"}</button>
  </div>`;
}
const AXS = ["생성\n안정성","원작\n재현","서사\n압축","모션\n임팩트"];
const HEAD = `<div class="row rhead"><div class="rk" title="해당 풀 안에서의 적합도 순위">순위</div>
  <div title="바꾸면 바로 저장됩니다">제작 담당</div><div>작품</div>
  <div class="axh">${AXS.map((t,j)=>`<i title="${AXN[j]} (10점)"><em style="background:${AXC[j]}"></em>${["①","②","③","④"][j]}<b>${t.replace("\n","<br>")}</b></i>`).join("")}</div>
  <div class="num">GW</div><div class="num">한국</div>
  <div style="text-align:center" title="숫자에 마우스를 올리면 4축 상세와 코멘트가 보입니다">${BASIS==="s4"?"제작":"적합"}</div>
  <div class="issh" title="판권 없음 등 이슈가 있는 작품을 표시합니다">이슈</div></div>`;

function listHTML(arr,title,desc,scope){
  const lbl=(scope==="남"?"남성향 30위":scope==="여"?"여성향 20위":"전체 50위")+(BASIS==="s4"?" · 제작 4축 기준":"");
  if(scope==="none") return `<div><div class="colh"><b>${title}</b><span>${desc}</span></div>
    ${HEAD}${arr.length?arr.map((w,i)=>rowHTML(w,i,"none")).join(""):`<div class="empty">이슈로 표시한 작품이 없습니다</div>`}</div>`;
  let body="", drawn=false;
  arr.forEach((w,i)=>{
    if(!drawn && !inCut(w,scope) && i>0){ body+=`<div class="cutline"><span>${lbl} 컷</span></div>`; drawn=true; }
    body+=rowHTML(w,i,scope);
  });
  return `<div><div class="colh"><b>${title}</b><span>${desc}</span></div>
    ${HEAD}${arr.length?body:`<div class="empty">해당 작품이 없습니다</div>`}</div>`;
}

/* ── 렌더 ── */
function render(){
  ranks();
  const all = view();
  const cols = document.getElementById("cols");
  const label = (w)=> w.t==="남"?"남성향" : w.t==="여"?"여성향" : w.t==="여/남"?"여·남":"타겟 미정";
  const stat = (a)=>{const s=a.filter(x=>x.fit!=null); if(!s.length) return `${a.length}작품`;
    const avg=(s.reduce((p,c)=>p+(BASIS==="s4"?c.s4:c.fit),0)/s.length).toFixed(1);
    return `${a.length}작품 · 평균 ${BASIS==="s4"?"제작 4축":"적합도"} ${avg}`;};
  if(T==="issue"){
    cols.className="cols";
    const a=W.filter(w=>FLAG[w.n]).sort((x,y)=>(y.fit??-1)-(x.fit??-1));
    cols.innerHTML = listHTML(a,"이슈 작품",`${a.length}작품 · 컷 집계에서 제외됩니다`,"none");
  }else if(T==="split"){
    cols.className="cols two";
    const m=all.filter(w=>w.t==="남"), f=all.filter(w=>w.t==="여");
    cols.innerHTML = listHTML(m,"남성향",`${stat(m)} · 상위 ${CUT["남"]}작품 강조`,"남")
                   + listHTML(f,"여성향",`${stat(f)} · 상위 ${CUT["여"]}작품 강조`,"여");
  }else{
    cols.className="cols";
    const sc = (T==="남"||T==="여") ? T : "all";
    const a = T==="all" ? all : all.filter(w=>w.t===T);
    const cn = CUT[sc]||CUT.all;
    cols.innerHTML = listHTML(a, T==="all"?"전체 라인업":label({t:T}), `${stat(a)} · 상위 ${cn}작품 강조`, sc);
  }
  // KPI
  const sc=W.filter(w=>w.fit!=null), fl=Object.keys(FLAG).length;
  const V=(w)=>BASIS==="s4"?w.s4:w.fit;
  const edge=(scope)=>{const a=W.filter(w=>inCut(w,scope)).sort((x,y)=>V(y)-V(x));
                       return a.length?`${V(a[a.length-1])}점 이상`:"—";};
  document.getElementById("kpis").innerHTML=[
    ["총 후보", W.length, "작품"],
    ["평가 기준", BASIS==="s4"?"제작 4축":"총 적합도", BASIS==="s4"?"40점 만점":"50점 만점"],
    ["전체 컷", CUT.all, edge("all")],
    ["남성향 컷", CUT["남"], edge("남")],
    ["여성향 컷", CUT["여"], edge("여")],
    ["이슈 표시", fl, fl?"작품 제외":"없음"],
  ].map(([k,v,u])=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join("");
  document.getElementById("btIssue").textContent = `이슈 ${fl}`;
  const OC={}; W.forEach(w=>{const o=ownerOf(w); OC[o]=(OC[o]||0)+1;});
  const keys=OWNERS.concat(Object.keys(OC).filter(k=>!OWNERS.includes(k)));
  document.getElementById("owners").innerHTML=keys.filter(k=>OC[k]).map(k=>
    `<button class="chip" data-o="${esc(k)}" aria-pressed="${String(O.has(k))}">${esc(k)} <span style="color:var(--muted)">${OC[k]}</span></button>`).join("");
  document.getElementById("ver").innerHTML =
    `<b>${BUILD}</b> 공유 저장소 ${SB.on?`설정됨 (${SUPABASE_URL.replace("https://","").split(".")[0]})`:"<b style=\"color:var(--serious)\">미설정</b>"}`;
  document.getElementById("sub").textContent =
    BASIS==="s4"
      ? `${W.length}개 작품 · 제작 4축만(40점) — 조회수를 빼고 제작 난이도·각색 여지만으로 본 순위입니다`
      : `${W.length}개 작품 · 총 적합도 = ① ~ ④ 합(40점) + GW 조회수(5점) + 한국 조회수(5점)`;
  save();
}

  if(e.key==="Escape"){ e.preventDefault(); closeOwner(); }
});

/* ── 적합도 마우스오버 툴팁 = 4축 상세 + 코멘트 ── */
const TIP=document.createElement("div"); TIP.id="tip"; document.body.appendChild(TIP);
const byName={}; W.forEach(w=>byName[w.n]=w);
function showTip(el){
  const w=byName[el.dataset.tip]; if(!w) return;
  const ax=[w.a,w.b,w.c,w.e];
  TIP.innerHTML=`<div class="tt">${esc(w.n)}</div>
    <div class="tx">${["① 생성안정성","② 원작재현","③ 서사압축","④ 모션임팩트"].map((n,j)=>`<s><i style="background:${AXC[j]}"></i>${n} <b>${ax[j]??"—"}</b></s>`).join("")}</div>
    <div class="tx" style="margin-bottom:0">4축 합 <b>${w.s4??"—"}</b> · GW <b>${w.gs??"—"}</b> · 한국 <b>${w.ks??"—"}</b> · 총 적합도 <b>${w.fit??"—"}</b></div>
    <div class="tx" style="margin-bottom:0">순위 — 총 적합도 <b>${RANK[w._i]?.allf??"—"}위</b> · 제작 4축 <b>${RANK[w._i]?.alls??"—"}위</b>${gem(w)?` <span style="color:#7ee2b8">(${gem(w)>0?"▲":"▼"}${Math.abs(gem(w))})</span>`:""}</div>
    ${w.cm?`<div class="tc">${esc(w.cm)}</div>`:""}`;
  TIP.classList.add("on");
  const r=el.getBoundingClientRect(), t=TIP.getBoundingClientRect();
  let x=r.left+r.width/2-t.width/2, y=r.bottom+8;
  if(x<8) x=8; if(x+t.width>innerWidth-8) x=innerWidth-8-t.width;
  if(y+t.height>innerHeight-8) y=r.top-t.height-8;
  TIP.style.left=x+"px"; TIP.style.top=Math.max(8,y)+"px";
}
document.addEventListener("mouseover",(e)=>{ const f=e.target.closest(".fit[data-tip]"); if(f) showTip(f); });
document.addEventListener("mouseout",(e)=>{ if(e.target.closest(".fit[data-tip]")) TIP.classList.remove("on"); });
document.addEventListener("scroll",()=>TIP.classList.remove("on"),true);

document.getElementById("segT").addEventListener("click",(e)=>{
  const b=e.target.closest("button"); if(!b)return;
  T=b.dataset.t; [...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed",String(x===b))); render();
});
document.getElementById("segB").addEventListener("click",(e)=>{
  const b=e.target.closest("button"); if(!b)return;
  BASIS=b.dataset.b; [...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  render();
});
document.getElementById("year").onchange=(e)=>{YEAR=e.target.value;render();};
document.getElementById("onlyGem").onchange=(e)=>{ONLYGEM=e.target.checked;render();};
document.getElementById("owners").addEventListener("click",(e)=>{
  const b=e.target.closest(".chip"); if(!b)return;
  const o=b.dataset.o; O.has(o)?O.delete(o):O.add(o);
  b.setAttribute("aria-pressed",String(O.has(o))); render();
});
document.getElementById("genres").addEventListener("click",(e)=>{
  const b=e.target.closest(".chip"); if(!b)return;
  const g=b.dataset.g; G.has(g)?G.delete(g):G.add(g);
  b.setAttribute("aria-pressed",String(G.has(g))); render();
});
document.getElementById("q").oninput=(e)=>{Q=e.target.value.trim().toLowerCase();render();};
document.getElementById("sort").onchange=(e)=>{SORT=e.target.value;render();};
document.getElementById("hideFlag").onchange=(e)=>{HIDE=e.target.checked;render();};
document.getElementById("copyLink").onclick=()=>{
  const u=location.origin+location.pathname+"#f="+enc({flag:FLAG,own:OWN});
  navigator.clipboard.writeText(u).then(()=>{
    const s=document.getElementById("nvStatus"); s.className="status ok"; s.textContent="링크를 복사했습니다";
    setTimeout(()=>{s.textContent="";s.className="status";},2500);
  });
};

/* ── 초기화 ── */
load();
const GS={};W.forEach(w=>GS[w.g||"미정"]=(GS[w.g||"미정"]||0)+1);
document.getElementById("genres").innerHTML=Object.entries(GS).sort((a,b)=>b[1]-a[1])
  .map(([g,n])=>`<button class="chip" data-g="${esc(g)}" aria-pressed="false">${esc(g)} <span style="color:var(--muted)">${n}</span></button>`).join("");

render();
if(SB.on){ chip("ok","공유 저장소 불러오는 중"); sbPull(true); setInterval(()=>sbPull(false),15000); }
else { READY=true; chip("off","공유 저장소 미설정 — 이슈 표시가 나에게만 보입니다"); }
</script></body></html>
